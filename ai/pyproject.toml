[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_parser"]

[project]
name = "ajt-ai-server"
version = "0.1.0"
description = "AJT AI 서버 — 원본문서 파싱과 위키 편집 에이전트 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26,<2",
    "python-docx>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pillow>=11,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: 로컬 Tesseract(eng traineddata) 필요",
]
