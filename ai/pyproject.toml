[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_parser", "src/wiki_mcp", "src/agent_runtime", "src/wiki_api"]

[project]
name = "ajt-ai-server"
version = "0.1.0"
description = "AJT AI 서버 — 원본문서 파싱과 위키 편집 에이전트 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26,<2",
    "python-docx>=1.2,<2",
    "mcp>=1.2",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    # multipart 업로드(`source-parses`). fastapi 가 전이로 끌어오지만 직접 쓰므로 명시한다.
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 배포 형태의 런타임. claude-code 런타임은 로그인 세션만 쓰므로 필요 없다.
deepagents = [
    "deepagents",
    "langchain-mcp-adapters",
    "langchain-anthropic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=0.24",
    "pillow>=11,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ocr: 로컬 Tesseract(eng traineddata) 필요",
]
