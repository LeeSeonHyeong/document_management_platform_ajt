spring:
  datasource:
    url: jdbc:h2:mem:ajt_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

ajt:
  auth:
    cookie-secure: false
  ai:
    # 로컬 개발 편의를 위한 기본 키. 운영에서는 AI_INTERNAL_API_KEY를 반드시 지정해야 한다.
    internal-api-key: ${AI_INTERNAL_API_KEY:local-dev-key}
  local-data:
    enabled: true

server:
  port: 8080
