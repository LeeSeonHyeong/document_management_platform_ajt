spring:
  application:
    name: ajt-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

ajt:
  auth:
    access-token-secret: ${AJT_ACCESS_TOKEN_SECRET:local-dev-access-token-secret}
    access-token-expiration: ${AJT_ACCESS_TOKEN_EXPIRATION:1h}
    password-reset-secret: ${AJT_PASSWORD_RESET_SECRET:local-dev-password-reset-secret}
    password-reset-expiration: ${AJT_PASSWORD_RESET_EXPIRATION:30m}
    cookie-secure: ${AJT_AUTH_COOKIE_SECURE:true}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    # 기본값을 두지 않는다. 비어 있으면 기동을 실패시켜 알려진 키로 내부 API가 열리는 것을 막는다.
    # 로컬 기본값은 application-local.yml에만 둔다.
    internal-api-key: ${AI_INTERNAL_API_KEY:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_READ_TIMEOUT:10m}
    # 일정 추출은 계약상 최대 180초 동기 처리다. 파싱·Wiki 변환보다 짧게 따로 건다.
    schedule-extraction-read-timeout: ${AI_SCHEDULE_EXTRACTION_READ_TIMEOUT:180s}
  document:
    storage:
      root-path: ${DOCUMENT_STORAGE_ROOT:build/ajt-documents}
  schedule:
    # 일정 원본문서는 schedule-sources/ 아래에 두며, 파일 구조 설계상 wiki/ 와 같은 루트를 공유한다.
    source-storage:
      root-path: ${SCHEDULE_SOURCE_STORAGE_ROOT:${DOCUMENT_STORAGE_ROOT:build/ajt-documents}}
  inquiry:
    storage:
      root-path: ${INQUIRY_STORAGE_ROOT:build/ajt-inquiries}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true