# AJT 운영 배포용 docker-compose
# Jenkins가 미리 빌드한 Git commit SHA 이미지로 backend + frontend + AI + mysql을 실행한다.
# DEPLOY_ENV_FILE은 Compose 변수 해석과 컨테이너 환경변수 주입에 같은 파일을 사용하게 한다.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-ajt}"
      MYSQL_USER: "${MYSQL_USER:-ajt}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/db/erd.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ai:
    image: "${AI_IMAGE:-ajt-ai}:${IMAGE_TAG:?IMAGE_TAG is required}"
    environment:
      # Spring과 FastAPI는 이 값 하나를 공유한다. 실제 값은 Jenkins 환경 파일에만 둔다.
      INTERNAL_API_KEY: "${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY is required}"
      BACKEND_BASE_URL: "http://backend:8080"
      # 운영 배포는 모든 LLM 호출을 SSAFY GMS의 Anthropic API로 고정한다.
      AI_RUNTIME: "deepagents"
      AI_MODEL: "anthropic:claude-sonnet-4-6"
      AI_MODEL_FAST: "anthropic:claude-haiku-4-5-20251001"
      AI_MODEL_QUALITY: "anthropic:claude-sonnet-4-6"
      SCHEDULE_EXTRACTOR_PROVIDER: "anthropic"
      SCHEDULE_EXTRACTOR_MODEL: "claude-haiku-4-5-20251001"
      # 비우면 SDK 기본 엔드포인트(api.anthropic.com, 직접 Claude)를 쓴다.
      # GMS 게이트웨이를 쓰려면 해당 스택 env 파일에
      # ANTHROPIC_BASE_URL=https://gms.ssafy.io/gmsapi/api.anthropic.com 를 지정한다.
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}"
      # 스캔 PDF OCR 은 Google Gemini 비전으로 읽는다 — GMS 게이트웨이의 ~100KB 본문
      # 제한 때문에 실제 스캔 페이지가 anthropic 경로에선 거의 다 실패한다(settings.py).
      # 키가 비면(:-) 코드가 로컬 Tesseract 로 폴백하므로 배포가 죽지는 않는다.
      VISION_OCR_PROVIDER: "gemini"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # 코드 기본값(_DEFAULT_MODEL, gemini_vision_ocr.py)과 맞춘다 — 무료 티어에서
      # 실제 통과하는 모델명이 바뀌면 양쪽을 함께 갱신한다.
      GEMINI_MODEL: "gemini-flash-lite-latest"
    expose:
      - "8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    image: "${BACKEND_IMAGE:-ajt-backend}:${IMAGE_TAG:?IMAGE_TAG is required}"
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}"
      AJT_ACCESS_TOKEN_SECRET: "${AJT_ACCESS_TOKEN_SECRET:?AJT_ACCESS_TOKEN_SECRET is required}"
      AJT_ACCESS_TOKEN_EXPIRATION: "${AJT_ACCESS_TOKEN_EXPIRATION:-1h}"
      AJT_PASSWORD_RESET_SECRET: "${AJT_PASSWORD_RESET_SECRET:?AJT_PASSWORD_RESET_SECRET is required}"
      AJT_PASSWORD_RESET_EXPIRATION: "${AJT_PASSWORD_RESET_EXPIRATION:-30m}"
      AJT_AUTH_COOKIE_SECURE: "${AJT_AUTH_COOKIE_SECURE:-true}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-superadmin@ajt.com}"
      MAIL_HOST: "${MAIL_HOST:-smtp.naver.com}"
      MAIL_PORT: "${MAIL_PORT:-465}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-noreply@ajt.local}"
      AI_BASE_URL: "http://ai:8000"
      AI_INTERNAL_API_KEY: "${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY is required}"
      AI_CONNECT_TIMEOUT: "${AI_CONNECT_TIMEOUT:-5s}"
      AI_READ_TIMEOUT: "${AI_READ_TIMEOUT:-10m}"
      AI_SCHEDULE_EXTRACTION_READ_TIMEOUT: "${AI_SCHEDULE_EXTRACTION_READ_TIMEOUT:-180s}"
      DOCUMENT_STORAGE_ROOT: "${DOCUMENT_STORAGE_ROOT:-/data/ajt/documents}"
      SCHEDULE_SOURCE_STORAGE_ROOT: "${SCHEDULE_SOURCE_STORAGE_ROOT:-/data/ajt/schedule-sources}"
      INQUIRY_STORAGE_ROOT: "${INQUIRY_STORAGE_ROOT:-/data/ajt/inquiries}"
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - ajt-files:/data/ajt
    healthcheck:
      # 전역 Actuator health는 SMTP 같은 외부 연동 상태까지 포함한다.
      # 컨테이너 생존 여부는 인증 없이 공개된 서비스 자체 헬스 엔드포인트로 판단한다.
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: "${FRONTEND_IMAGE:-ajt-frontend}:${IMAGE_TAG:?IMAGE_TAG is required}"
    ports:
      - "${FRONTEND_PORT:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "--quiet", "https://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql-data:
    name: "${MYSQL_VOLUME_NAME:-ajt-prod-mysql-data}"
  ajt-files:
    name: "${AJT_FILES_VOLUME_NAME:-ajt-prod-files}"
