server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 실제 파일이 없는 경로는 index.html로 넘겨 react-router가 처리하게 한다.
    # (이게 없으면 /login 등을 새로고침할 때 404 남)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 로 시작하는 요청은 백엔드로 넘긴다.
    # 'backend' = docker-compose 의 백엔드 서비스 이름 (compose 가 이 이름으로 DNS 를 잡아줌).
    # proxy_pass 뒤에 경로를 안 붙여야 원래 URI(/api/v1/...)가 그대로 백엔드에 전달된다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
