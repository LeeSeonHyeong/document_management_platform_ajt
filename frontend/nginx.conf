server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 실제 파일이 없는 경로는 index.html로 넘겨 react-router가 처리하게 한다.
    # (이게 없으면 /login 등을 새로고침할 때 404 남)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE(Step B): 여기에 /api 프록시를 추가해 백엔드 컨테이너로 넘길 예정.
    # location /api/ { proxy_pass http://ajt-be:8080; ... }
}
